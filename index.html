<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadiMachi - Tamil Nadu Syllabus Guide</title>
  <link rel="stylesheet" href="style.css">
  <script src="protection.js" defer></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>
  <script>
    
    // --- Copy & Screenshot Protection ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
      if (e.ctrlKey && ['u', 's', 'c', 'x', 'p'].includes(e.key)) e.preventDefault();
      if (e.key === 'PrintScreen') alert('Screenshots are disabled!');
    };
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
  </script>
</head>
<body>
  <!-- Hero Section -->
  <header class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>🔥 PadiMachi</h1>
      <p>Tamil Nadu Syllabus Guide – Engineering</p>
      <a href="#courses" class="cta-btn">Explore Now</a>
    </div>
  </header>

  <!-- Ad Section -->
  <section class="ads">
    <div class="ad-box">
      <!-- AdSense Code Placeholder -->
      <p>Ad Space</p>
    </div>
  </section>

  <!-- Courses Section -->
  <section id="courses" class="subjects">
    <h2>Choose Your Category</h2>
    <div class="cards">
      <div class="card">
        <h3>🎓 Engineering</h3>
        <p>All Subject Answers for all branches.</p>
        <a href="1st_year.html" class="view-btn">View here</a>
      </div>
        

     
    
    <div class="card">
        <h3>📘 11th Standard</h3>
        <p>Tamil Nadu 11th syllabus Guide, one-mark questions, and guides.</p>
        <a href="11th.html" class="view-btn">View here</a>
      </div>
    </div>
  </section>

  <!-- Ad Section -->
  <section class="ads">
    <div class="ad-box">
      <p>Ad Space</p>
    </div>
  </section>

 
 

 
</body>
</html>
